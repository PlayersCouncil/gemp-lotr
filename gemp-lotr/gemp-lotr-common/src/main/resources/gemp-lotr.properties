## Application root, used for example for storing replay files 
application.root=/etc/gemp-lotr

## DB connection
db.connection.class=com.mysql.cj.jdbc.Driver
db.connection.url=jdbc:mysql://db:3306/gemp_db
db.connection.username=gempuser
db.connection.password=gemppassword
db.connection.validateQuery=/* ping */ select 1

port=80
websocket.port=8080
web.path=/etc/gemp-lotr/web/
## Scenarios written by players (see ScenarioLibrary).  Kept outside the repository; the folder need not exist.
scenarios.user.path=/etc/gemp-lotr/scenarios
resources.path=/etc/gemp-lotr/gemp-lotr-cards/src/main/resources/
dev.resources.path=../gemp-lotr-cards/src/main/resources/
test.resources.path=../gemp-lotr-cards/src/main/resources/

origin.allowed.pattern=^.*$

## PC accounts (PC-ACCOUNT.md). test: there are none, and Gemp is as it always was; the default, for local
## development and test servers. optional: sign in with a PC account or with a password; new accounts through a PC
## account only. Any other mode stops the server at start.
## Each argonauth.x.y can be given as the environment variable ARGONAUTH_X_Y instead (docker/.env), which wins:
## that is where the client secret belongs.
argonauth.mode=test
#argonauth.issuer=http://localhost:1630
#argonauth.client.id=gemp-dev
#argonauth.client.secret=gemp-dev-secret
#argonauth.redirect.uri=http://localhost:17001/gemp-lotr-server/argonauth/callback
#argonauth.postlogout.uri=http://localhost:17001/gemp-lotr/ng/login
## Where this server reaches Argonauth, when that is not the issuer's address (both in containers on one machine)
#argonauth.backchannel.url=http://host.docker.internal:1630

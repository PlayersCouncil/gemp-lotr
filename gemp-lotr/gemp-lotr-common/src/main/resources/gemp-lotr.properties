## A value written ${NAME:-default} is the environment variable NAME, or the default when that is unset or blank
## (AppConfig). In Docker the environment is docker/.env, every line of which reaches the app's container: change
## those settings there and restart the container, with no rebuild. Outside Docker (an IDE, the unit tests) the
## defaults stand. Anything not written that way is set here and nowhere else.

## Application root, used for example for storing replay files 
application.root=/etc/gemp-lotr

## DB connection
db.connection.class=com.mysql.cj.jdbc.Driver
## The database's name is not taken from MYSQL_DATABASE: queries in seven of the DAOs name gemp_db themselves
## (DbLeagueDAO, DbScenarioDAO and others), so no other name works.
db.connection.url=jdbc:mysql://${DB_CONTAINER_NAME:-db}:3306/gemp_db
db.connection.username=${MYSQL_USER:-gempuser}
db.connection.password=${MYSQL_PASSWORD:-gemppassword}
db.connection.validateQuery=/* ping */ select 1

port=80
websocket.port=8080
web.path=/etc/gemp-lotr/web/
## Scenarios written by players (see ScenarioLibrary).  Kept outside the repository; the folder need not exist.
scenarios.user.path=/etc/gemp-lotr/scenarios
resources.path=/etc/gemp-lotr/gemp-lotr-cards/src/main/resources/
dev.resources.path=../gemp-lotr-cards/src/main/resources/
test.resources.path=../gemp-lotr-cards/src/main/resources/

origin.allowed.pattern=^.*$

## PC accounts (PC-ACCOUNT.md). test: there are none, and Gemp is as it always was; the default, for local
## development and test servers. optional: sign in with a PC account or with a password; new accounts through a PC
## account only. Any other mode stops the server at start.
## docker/.env.example says what each of these is; the client secret belongs in docker/.env and not in this file.
argonauth.mode=${SSO_MODE:-test}
argonauth.issuer=${SSO_ISSUER:-}
argonauth.client.id=${SSO_CLIENT_ID:-}
argonauth.client.secret=${SSO_CLIENT_SECRET:-}
argonauth.redirect.uri=${SSO_REDIRECT_URI:-}
argonauth.postlogout.uri=${SSO_POSTLOGOUT_URI:-}
## Where this server reaches Argonauth, when that is not the issuer's address (both in containers on one machine)
argonauth.backchannel.url=${SSO_BACKCHANNEL_URL:-}

<button id="newDeckBut" title="New deck" class="menu-button" gempUiButton (click)="deck.newDeck()">
  <span class="ui-button-text"><span class="ui-icon ui-icon-document"></span></span>
</button>
<button id="saveDeckBut" title="Save deck" class="menu-button" gempUiButton (click)="deck.saveCurrentDeck()">
  <span class="ui-button-text"><span class="ui-icon ui-icon-disk"></span></span>
</button>
<button id="renameDeckBut" title="Rename deck" class="menu-button" gempUiButton (click)="deck.renameCurrentDeck()">
  <span class="ui-button-text"><span class="ui-icon ui-icon-pencil"></span></span>
</button>
<button id="copyDeckBut" title="Copy deck to new" class="menu-button" gempUiButton (click)="deck.copyDeck()">
  <span class="ui-button-text"><span class="ui-icon ui-icon-copy"></span></span>
</button>
<button id="importDeckBut" title="Import Deck" class="menu-button" gempUiButton (click)="dialogs.openImport()">
  <span class="ui-button-text"><span class="ui-icon ui-icon-arrowthickstop-1-s"></span></span>
</button>
<button id="libraryListBut" title="Open Library" class="menu-button" gempUiButton (click)="dialogs.openLibrary()">
  <span class="ui-button-text"><span class="ui-icon ui-icon-bookmark"></span></span>
</button>
<button id="deckListBut" title="Deck list" class="menu-button" gempUiButton (click)="dialogs.openDeckList()">
  <span class="ui-button-text"><span class="ui-icon ui-icon-suitcase"></span></span>
</button>
<button
  id="convertErrataBut"
  title="Convert to PC Errata"
  class="menu-button"
  gempUiButton
  [disabled]="!deck.convertErrataEnabled()"
  (click)="deck.convertErrata()"
>
  <span class="ui-button-text"><span class="ui-icon ui-icon-transferthick-e-w"></span></span>
</button>

<select id="formatSelect" style="float: right; width: 200px" (change)="selectFormat($event)">
  @for (option of deck.formatOptions(); track $index) {
    <option [value]="option.value" [disabled]="option.disabled" [selected]="$index === deck.selectedFormatIndex()">
      {{ option.label }}
    </option>
  }
</select>

<button id="notesBut" title="Add/Edit Notes" class="menu-button" gempUiButton (click)="dialogs.openNotes()">
  <span class="ui-button-text"><span class="ui-icon ui-icon-plus"></span></span>
</button>

<!-- prettier-ignore -->
<span id="editingDeck">@if (deck.label().modified) {<font color="orange">*{{ deck.label().text }} - modified</font>} @else {{{ deck.label().text }}}</span>

<select id="collectionSelect" (change)="selectCollection($event)">
  @for (collection of baseCollections; track collection.type) {
    <option [value]="collection.type" [selected]="collection.type === collectionType()">
      {{ collection.name }}
    </option>
  }
  @for (collection of limitedCollections(); track $index) {
    <option [value]="collection.type" [selected]="collection.type === collectionType()">
      {{ collection.name }}
    </option>
  }
</select>

<!-- Not on touch devices, where cards don't zoom on hover -->
@if (!zoom.touchDevice) {
  <button id="auto-zoom-toggle" gempUiButton="icon" title="Auto-zoom cards on hover" (click)="zoom.toggle()">
    <span
      class="ui-button-icon-primary ui-icon"
      [class.ui-icon-search]="zoom.enabled()"
      [class.ui-icon-circle-close]="!zoom.enabled()"
    ></span>
    <span class="ui-button-text">Auto-zoom cards on hover</span>
  </button>
}

<select id="themeSelect" title="Theme" aria-label="Theme" (change)="selectTheme($event)">
  @for (option of themes; track option.name) {
    <option [value]="option.name" [selected]="option.name === theme.theme()">{{ option.label }}</option>
  }
</select>

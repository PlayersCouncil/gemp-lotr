<button id="newDeckBut" title="New deck" class="menu-button" gempUiButton>
  <span class="ui-button-text"><span class="ui-icon ui-icon-document"></span></span>
</button>
<button id="saveDeckBut" title="Save deck" class="menu-button" gempUiButton>
  <span class="ui-button-text"><span class="ui-icon ui-icon-disk"></span></span>
</button>
<button id="renameDeckBut" title="Rename deck" class="menu-button" gempUiButton>
  <span class="ui-button-text"><span class="ui-icon ui-icon-pencil"></span></span>
</button>
<button id="copyDeckBut" title="Copy deck to new" class="menu-button" gempUiButton>
  <span class="ui-button-text"><span class="ui-icon ui-icon-copy"></span></span>
</button>
<button id="importDeckBut" title="Import Deck" class="menu-button" gempUiButton>
  <span class="ui-button-text"><span class="ui-icon ui-icon-arrowthickstop-1-s"></span></span>
</button>
<button id="libraryListBut" title="Open Library" class="menu-button" gempUiButton>
  <span class="ui-button-text"><span class="ui-icon ui-icon-bookmark"></span></span>
</button>
<button id="deckListBut" title="Deck list" class="menu-button" gempUiButton>
  <span class="ui-button-text"><span class="ui-icon ui-icon-suitcase"></span></span>
</button>
<button
  id="convertErrataBut"
  title="Convert to PC Errata"
  class="menu-button"
  gempUiButton
  [disabled]="!convertErrataEnabled()"
>
  <span class="ui-button-text"><span class="ui-icon ui-icon-transferthick-e-w"></span></span>
</button>

<select id="formatSelect" style="float: right; width: 200px">
  <option value="rev_tow_sta">Anything Goes</option>
</select>

<button id="notesBut" title="Add/Edit Notes" class="menu-button" gempUiButton>
  <span class="ui-button-text"><span class="ui-icon ui-icon-plus"></span></span>
</button>

<span id="editingDeck">{{ deckName() }}</span>

<select id="collectionSelect" (change)="selectCollection($event)">
  @for (collection of baseCollections; track collection.type) {
    <option [value]="collection.type" [selected]="collection.type === collectionType()">
      {{ collection.name }}
    </option>
  }
  @for (collection of limitedCollections(); track $index) {
    <option [value]="collection.type" [selected]="collection.type === collectionType()">
      {{ collection.name }}
    </option>
  }
</select>

<button id="auto-zoom-toggle" gempUiButton="icon" title="Auto-zoom cards on hover">
  <span
    class="ui-button-icon-primary ui-icon"
    [class.ui-icon-search]="autoZoomEnabled()"
    [class.ui-icon-circle-close]="!autoZoomEnabled()"
  ></span>
  <span class="ui-button-text">Auto-zoom cards on hover</span>
</button>

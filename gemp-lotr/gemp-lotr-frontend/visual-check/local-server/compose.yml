# A throwaway Gemp server for the visual check (see ../README.md): its own project, port and in-memory database, so it
# never touches the development server. Started and stopped by ../local-server.mjs.
name: gemp-visual-check

services:
  db:
    image: mariadb:10.5
    env_file:
      - ../../../docker/.env
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ../../../database_script.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ${CHECK_STATE_DIR}/init.sql:/docker-entrypoint-initdb.d/02-players.sql:ro
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 2s
      timeout: 5s
      retries: 60

  app:
    image: gemp_app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:${CHECK_PORT}:80'
    volumes:
      - ${CHECK_WEB_JAR:-../../../gemp-lotr-async/target/web.jar}:/etc/gemp-lotr/gemp-lotr-async/target/web.jar:ro
      - ../../../gemp-lotr-cards/src/main/resources:/etc/gemp-lotr/gemp-lotr-cards/src/main/resources:ro
      - ../../../gemp-lotr-async/src/main/web:/etc/gemp-lotr/web:ro
      # This run's own build of the Angular page, so a rebuild elsewhere can't change it in the middle of a run
      - ${CHECK_STATE_DIR}/ng/browser:/etc/gemp-lotr/web/ng:ro
    command: >-
      java -jar -Dlog4j2.contextSelector=org.apache.logging.log4j.core.async.AsyncLoggerContextSelector
      /etc/gemp-lotr/gemp-lotr-async/target/web.jar

<html lang="en">
<head>
	<meta charset="utf-8">
	<title>GEMP: LotR-TCG - Login</title>
	<link rel="apple-touch-icon" sizes="180x180" href="images/icons/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="images/icons/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="images/icons/favicon-16x16.png">

	<!--
		The start page (the login page) is part of the Angular app now (gemp-lotr-frontend, served under /gemp-lotr/ng/).  This page only sends
		the browser on, with the link's query and #fragment: a fragment never reaches the server, so a page has to pass
		it on.  Where each old link leads is decided in the app (core/hall/legacy-links.guard.ts), not here.  The tags
		above are for the sites that preview a link: they read this page and run no script.
		The legacy page is kept as login-legacy.html until it is removed.
	-->
	<script>
		window.location.replace("/gemp-lotr/ng/start" + window.location.search + window.location.hash);
	</script>
</head>
